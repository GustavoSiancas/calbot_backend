openapi: 3.0.3
info:
  title: CalBot API
  version: 0.1.0
  description: API for managing staff authentication and CalBot content.
servers:
  - url: https://calbotbackend-production.up.railway.app
    description: Production (Railway)
  - url: http://localhost:8080
    description: Local development
paths:
  /health:
    get:
      summary: Service health check
      responses:
        '204':
          description: Service is available
  /api/v1/auth/bootstrap-admin:
    post:
      tags: [Authentication]
      summary: Create the one-time initial administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBootstrapRequest'
      responses:
        '201':
          description: Administrator created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An administrator already exists
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in a staff or administrator account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated account and bearer token
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
  /api/v1/staff:
    post:
      tags: [Staff]
      summary: Register a staff account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStaffRequest'
      responses:
        '201':
          description: Staff account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Administrator role required
  /api/v1/staff/menu-options:
    get:
      tags: [Staff menu]
      summary: List every menu option and all associated content, including inactive records
      description: Requires a bearer token belonging to a STAFF account.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All menu options with their prompts, response groups, and response items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMenuOption'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
    post:
      tags: [Staff menu]
      summary: Create a menu option
      description: Requires a bearer token belonging to a STAFF account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuOptionRequest'
      responses:
        '201':
          description: Menu option created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuOption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '409':
          description: Parent option already has response groups and cannot receive children
  /api/v1/staff/menu-options/{id}/deactivate:
    patch:
      tags: [Staff menu]
      summary: Deactivate a menu option without deleting it
      description: Requires a bearer token belonging to a STAFF account.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Menu option deactivated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '404':
          description: Active menu option not found
  /api/v1/staff/menu-options/{id}:
    get:
      tags: [Staff menu]
      summary: Get one menu option without associated prompts or response content
      description: Requires a bearer token belonging to a STAFF account. Active and inactive options can be retrieved.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Menu option table data only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffMenuOptionRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '404':
          description: Menu option not found
    delete:
      tags: [Staff menu]
      summary: Permanently delete a menu option and its dependent content
      description: Requires a STAFF bearer token. Deletes child menu options, prompts, response groups, and response items through database cascades. Content feedback is independent and is retained.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Menu option and its dependent content deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '404':
          description: Menu option not found
  /api/v1/staff/menu-options/tree:
    get:
      tags: [Staff menu]
      summary: List menu options for a tree with recursive branch visibility analysis
      description: Requires a STAFF bearer token. Without parent_id it returns root options; with parent_id it returns direct children. Active and inactive records are included, while isAviable explains whether each complete branch can reach an active final response.
      security:
        - bearerAuth: []
      parameters:
        - name: parent_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Root menu options, without nested relations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMenuOptionTreeRow'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
  /api/v1/staff/prompts:
    get:
      tags: [Prompts]
      summary: List all prompt variants for a menu option
      description: Requires a STAFF bearer token. Active and inactive prompts are returned.
      security:
        - bearerAuth: []
      parameters:
        - name: menu_option_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: All prompts for the menu option
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffMenuOptionPrompt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '404':
          description: Menu option not found
    post:
      tags: [Prompts]
      summary: Create a prompt variant for a menu option
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePromptRequest'
      responses:
        '201':
          description: Prompt created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuOptionPrompt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '409':
          description: The menu option already has response groups and cannot receive prompts
  /api/v1/staff/response-groups:
    post:
      tags: [Response groups]
      summary: Create a response-group variant for a menu option
      description: A menu option can have multiple response groups. Each group represents an independent response variant and is saved with its items atomically.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResponseGroupRequest'
      responses:
        '201':
          description: Response group created with its items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '409':
          description: The menu option already has child options or prompts
  /api/v1/staff/response-groups/by-menu-option/{menuOptionID}:
    get:
      tags: [Response groups]
      summary: List all response groups and response items for a menu option
      description: Requires a STAFF bearer token. Active and inactive groups and items are returned.
      security:
        - bearerAuth: []
      parameters:
        - name: menuOptionID
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: All response groups and items for the menu option
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffResponseGroup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '404':
          description: Menu option not found
  /api/v1/staff/response-groups/{id}:
    delete:
      tags: [Response groups]
      summary: Permanently delete one response group and its items
      description: Requires a STAFF bearer token. Response items are deleted by cascade. Content feedback is independent and is not affected.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Response group and its items deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '404':
          description: Response group not found
  /api/v1/staff/prompts/{id}:
    delete:
      tags: [Prompts]
      summary: Permanently delete a menu option prompt
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PromptID'
      responses:
        '204':
          description: Prompt deleted
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '404':
          description: Prompt not found
  /api/v1/staff/prompts/{id}/active:
    patch:
      tags: [Prompts]
      summary: Set the active state of a menu option prompt
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PromptID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
      responses:
        '200':
          description: Prompt state updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing or invalid staff token
        '403':
          description: Staff role required
        '404':
          description: Prompt not found
  /public/menu-options:
    get:
      tags: [Public menu]
      summary: List visible active root menu options with their next-step availability
      description: Options that cannot continue to visible children and do not have an active final response are omitted.
      responses:
        '200':
          description: Active options without a parent, ordered by sort order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicParentMenuOption'
  /public/menu-options/{id}:
    get:
      tags: [Public menu]
      summary: Get an active menu option, one weighted-random active prompt, and active child options
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The selected option and its available next options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuOptionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Active menu option not found
  /public/menu-options/{id}/responses:
    get:
      tags: [Public menu]
      summary: Get one weighted-random active response group and its active response items
      description: Each active response group is selected with probability proportional to its weight. The response items inside the selected group remain ordered by sort_order. Returns null when the option has no active response group.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: One selected active response group and its ordered active items, or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseGroup'
                nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Active menu option not found
  /public/menu-options/{id}/sub-options:
    get:
      tags: [Public menu]
      summary: Get one weighted-random prompt and the active child options
      description: Selects one active prompt with probability proportional to its weight. Only visible child options are returned; an option that cannot continue is not exposed publicly.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Selected prompt, which can be null, and active direct child options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSubOptionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Active menu option not found
  /public/content-feedback:
    post:
      tags: [Public feedback]
      summary: Submit a standalone feedback message for future staff review
      description: This endpoint only stores the submitted name, IP address, and message. It never changes menu content automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentFeedbackRequest'
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFeedbackCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    PromptID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AdminBootstrapRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
    LoginRequest:
      type: object
      required: [password]
      description: "Provide the username for a staff or administrator account."
      properties:
        username:
          type: string
          example: staff.user
        password:
          type: string
          format: password
    RegisterStaffRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: staff.user
        password:
          type: string
          format: password
    User:
      type: object
      required: [id, role, created_at]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          nullable: true
        role:
          type: string
          enum: [STAFF, ADMIN]
        created_at:
          type: string
          format: date-time
    MenuOption:
      type: object
      required: [id, title, sort_order, has_prompt]
      properties:
        id:
          type: integer
          format: int64
        parent_option_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
        has_prompt:
          type: boolean
          description: True when the option has prompts. Public responses consider only active prompts; STAFF responses include active and inactive prompts.
    PublicParentMenuOption:
      type: object
      required: [id, title, sort_order, is_active, isAviable]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        sort_order:
          type: integer
        is_active:
          type: boolean
        isAviable:
          $ref: '#/components/schemas/PublicParentAvailability'
    PublicParentAvailability:
      type: object
      required: [has_response, has_children]
      properties:
        has_response:
          type: boolean
        has_children:
          type: boolean
    PublicSubOptionsResponse:
      type: object
      required: [options]
      properties:
        prompt:
          allOf:
            - $ref: '#/components/schemas/MenuOptionPrompt'
          nullable: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/PublicParentMenuOption'
    MenuOptionDetail:
      allOf:
        - $ref: '#/components/schemas/MenuOption'
        - type: object
          required: [options]
          properties:
            prompt:
              allOf:
                - $ref: '#/components/schemas/MenuOptionPrompt'
              nullable: true
            options:
              type: array
              description: Active child options ordered by sort order.
              items:
                $ref: '#/components/schemas/MenuOption'
    MenuOptionPrompt:
      type: object
      required: [id, message]
      properties:
        id:
          type: integer
          format: int64
        message:
          type: string
    ResponseGroup:
      type: object
      required: [id, name, items]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResponseItem'
    ResponseItem:
      type: object
      required: [id, type, sort_order]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [TEXT, LINK, IMAGE, YOUTUBE, VIDEO, DOCUMENT]
        text:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        sort_order:
          type: integer
    ContentFeedbackRequest:
      type: object
      required: [full_name, ip, message]
      properties:
        full_name:
          type: string
        ip:
          type: string
          format: ipv4
        message:
          type: string
    ContentFeedbackCreated:
      type: object
      required: [id, created_at]
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    CreateMenuOptionRequest:
      type: object
      required: [parent_option_id, title, sort_order]
      properties:
        parent_option_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
        sort_order:
          type: integer
    CreatePromptRequest:
      type: object
      required: [menu_option_id, message]
      properties:
        menu_option_id:
          type: integer
          format: int64
        message:
          type: string
        weight:
          type: integer
          minimum: 1
          default: 1
    CreateResponseGroupRequest:
      type: object
      required: [menu_option_id, name, items]
      properties:
        menu_option_id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        weight:
          type: integer
          minimum: 1
          default: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReplaceResponseItemRequest'
    ReplaceResponseItemRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [TEXT, LINK, IMAGE, YOUTUBE, VIDEO, DOCUMENT]
        text:
          type: string
          nullable: true
          description: Required when type is TEXT.
        url:
          type: string
          nullable: true
          description: Required when type is LINK, IMAGE, YOUTUBE, VIDEO, or DOCUMENT.
        caption:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        sort_order:
          type: integer
          default: 0
    StaffMenuOption:
      allOf:
        - $ref: '#/components/schemas/MenuOption'
        - type: object
          required: [is_active, created_at, updated_at, prompts, response_groups]
          properties:
            is_active:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            prompts:
              type: array
              items:
                $ref: '#/components/schemas/StaffMenuOptionPrompt'
            response_groups:
              type: array
              items:
                $ref: '#/components/schemas/StaffResponseGroup'
    StaffMenuOptionRow:
      allOf:
        - $ref: '#/components/schemas/MenuOption'
        - type: object
          required: [is_active, created_at, updated_at]
          properties:
            is_active:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    StaffMenuOptionTreeRow:
      type: object
      required: [id, title, sort_order, is_active, created_at, updated_at, isAviable]
      properties:
        id:
          type: integer
          format: int64
        parent_option_id:
          type: integer
          format: int64
          nullable: true
        title:
          type: string
        description:
          type: string
          nullable: true
        sort_order:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        isAviable:
          $ref: '#/components/schemas/MenuOptionAvailability'
    MenuOptionAvailability:
      type: object
      required: [has_response, has_children, has_prompt, is_visible, reason]
      properties:
        has_response:
          type: boolean
          description: True when the option has at least one response group.
        has_children:
          type: boolean
          description: True when the option has at least one child menu option.
        has_prompt:
          type: boolean
          description: True when the option has at least one active prompt.
        is_visible:
          type: boolean
          description: True when the option can reach an active final response through itself or through at least one descendant branch.
        reason:
          type: string
          description: Human-readable explanation, including the causes when descendants prevent the branch from being visible.
    StaffMenuOptionPrompt:
      allOf:
        - $ref: '#/components/schemas/MenuOptionPrompt'
        - type: object
          required: [weight, is_active, created_at, updated_at]
          properties:
            weight:
              type: integer
            is_active:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    StaffResponseGroup:
      allOf:
        - $ref: '#/components/schemas/ResponseGroup'
        - type: object
          required: [menu_option_id, weight, is_active, created_at, updated_at]
          properties:
            menu_option_id:
              type: integer
              format: int64
            weight:
              type: integer
              minimum: 1
            is_active:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            items:
              type: array
              items:
                $ref: '#/components/schemas/StaffResponseItem'
    StaffResponseItem:
      allOf:
        - $ref: '#/components/schemas/ResponseItem'
        - type: object
          required: [is_active, created_at, updated_at]
          properties:
            is_active:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
